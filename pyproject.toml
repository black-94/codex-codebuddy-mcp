[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harness-acp-mcp"
dynamic = ["version"]
description = "An isolated MCP bridge for local and SSH ACP harness processes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "acp", "agents", "codebuddy", "codex"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=1.30,<2",
]

[project.scripts]
harness-acp-mcp = "harness_acp_mcp.server:main"
harness-acp-mcp-daemon = "harness_acp_mcp.daemon:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.hatch.version]
path = "src/harness_acp_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/harness_acp_mcp/*.py",
  "/tests/*.py",
  "/tools/*.py",
  "/docs/*.md",
  "/.gitignore",
  "/README.md",
  "/LICENSE",
  "/config.example.yaml",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_acp_mcp"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_codebuddy: uses an installed CodeBuddy Code executable",
  "real_codex: uses an installed codex-acp executable",
  "model: sends a real model prompt and may consume account quota",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
