[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-acp-mcp"
version = "0.2.0"
description = "An isolated MCP bridge for local and SSH ACP harness processes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=1.30,<2",
]

[project.scripts]
harness-acp-mcp = "harness_acp_mcp.server:main"
harness-acp-mcp-daemon = "harness_acp_mcp.daemon:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness_acp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_codebuddy: uses an installed CodeBuddy Code executable",
  "real_codex: uses an installed codex-acp executable",
  "model: sends a real model prompt and may consume account quota",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
